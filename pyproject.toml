[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki"
version = "0.1.0"
description = "Backend wiki-manager"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "orjson",
    "python-dotenv",
    "python-json-logger",
    "python-multipart",
    "sqlmodel",
    "sqlalchemy",
    "asyncpg",
    "pyjwt[crypto]",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportGeneralTypeIssues = "none"
reportCallIssue = "none"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportIncompatibleVariableOverride = "none"

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["var-annotated", "has-type", "call-overload", "assignment", "name-defined", "attr-defined"]

[tool.pyre]
source_directories = ["src"]
disabled = true